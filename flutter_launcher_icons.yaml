# Android and iOS app icons. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"

  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  # The foreground image is already padded for the safe zone; no extra inset.
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true

  # Web icons come from tool/generate_web_icons.dart: this tool would make
  # the maskable icons from image_path, and the mask would crop the logo.
  web:
    generate: false

  windows:
    generate: false
  macos:
    generate: false
